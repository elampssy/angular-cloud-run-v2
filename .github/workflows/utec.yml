name: Deploy to Google Cloud Run - Workload Identity Federation (Multi-User)

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: "utec-posgrado-01"
  GCP_REGION: "us-central1"
  ARTIFACT_REGISTRY_REPO: "app-elampssy"

jobs:
  # 1. Construcción y despliegue inicial / Canary
  build_and_canary:
    environment: dev
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      is_first_deploy: ${{ steps.check_service.outputs.is_first_deploy }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: "github-actions-elampssy@utec-posgrado-01.iam.gserviceaccount.com"
          project_id: "utec-posgrado-01"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verificar identidad de despliegue
        run: |
          echo "Cuenta activa de gcloud:"
          gcloud auth list \
            --filter=status:ACTIVE \
            --format="value(account)"

          echo "Proyecto activo:"
          gcloud config get-value project

          echo "Repositorio configurado:"
          printf '%s\n' "$ARTIFACT_REGISTRY_REPO"

          echo "Comprobando acceso al repositorio:"
          gcloud artifacts repositories describe "$ARTIFACT_REGISTRY_REPO" \
            --project="$GCP_PROJECT_ID" \
            --location="$GCP_REGION" \
            --format="value(name)"

      - name: Docker Auth
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Check if Service Exists
        id: check_service
        run: |
          SERVICE_NAME="gemini-angular-${{ secrets.ALUMNO_ID }}-${{ secrets.ENVIRONMENT_NAME }}"

          if gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" >/dev/null 2>&1; then
            echo "is_first_deploy=false" >> "$GITHUB_OUTPUT"
            echo "El servicio ya existe. Procediendo con Canary (10%)."
          else
            echo "is_first_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Primera vez. Se enviará el 100% del tráfico."
          fi

      - name: Build and Deploy (Canary logic)
        run: |
          SERVICE_NAME="gemini-angular-${{ secrets.ALUMNO_ID }}-${{ secrets.ENVIRONMENT_NAME }}"
          IMAGE_TAG="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REGISTRY_REPO/app-${{ secrets.ALUMNO_ID }}:${{ github.sha }}"

          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

          if [ "${{ steps.check_service.outputs.is_first_deploy }}" = "true" ]; then
            gcloud run deploy "$SERVICE_NAME" \
              --project="$GCP_PROJECT_ID" \
              --image="$IMAGE_TAG" \
              --service-account="${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}" \
              --region="$GCP_REGION" \
              --platform=managed \
              --allow-unauthenticated \
              --set-env-vars="ENVIRONMENT_NAME=${{ secrets.ENVIRONMENT_NAME }}"
          else
            PREVIOUS_REV=$(gcloud run services describe "$SERVICE_NAME" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --format="value(status.traffic.revisionName)" \
              | tr ';' '\n' | head -n 1)

            echo "La versión estable base es: $PREVIOUS_REV"

            gcloud run deploy "$SERVICE_NAME" \
              --project="$GCP_PROJECT_ID" \
              --image="$IMAGE_TAG" \
              --service-account="${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}" \
              --region="$GCP_REGION" \
              --platform=managed \
              --allow-unauthenticated \
              --no-traffic \
              --set-env-vars="ENVIRONMENT_NAME=${{ secrets.ENVIRONMENT_NAME }}"

            CANARY_REV=$(gcloud run services describe "$SERVICE_NAME" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --format="value(status.latestCreatedRevisionName)")

            echo "Asignando 90% a $PREVIOUS_REV y 10% a $CANARY_REV"

            gcloud run services update-traffic "$SERVICE_NAME" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --to-revisions="$PREVIOUS_REV=90,$CANARY_REV=10"
          fi

  # 2. Promoción del Canary
  promote_or_rollback:
    needs: build_and_canary
    if: needs.build_and_canary.outputs.is_first_deploy == 'false'
    environment: dev
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: "github-actions-elampssy@utec-posgrado-01.iam.gserviceaccount.com"
          project_id: "utec-posgrado-01"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Promote Canary to 100% Traffic
        run: |
          SERVICE_NAME="gemini-angular-${{ secrets.ALUMNO_ID }}-${{ secrets.ENVIRONMENT_NAME }}"

          CANARY_REV=$(gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format="value(status.latestCreatedRevisionName)")

          echo "Promoviendo la revisión $CANARY_REV al 100% de tráfico."

          gcloud run services update-traffic "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --to-revisions="$CANARY_REV=100"

  # 3. Rollback si la promoción falla o se cancela
  rollback_canary:
    needs: [build_and_canary, promote_or_rollback]
    if: always() && needs.build_and_canary.outputs.is_first_deploy == 'false' && (needs.promote_or_rollback.result == 'failure' || needs.promote_or_rollback.result == 'cancelled')
    environment: dev
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: "github-actions-elampssy@utec-posgrado-01.iam.gserviceaccount.com"
          project_id: "utec-posgrado-01"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Rollback Traffic (Remove Canary)
        run: |
          SERVICE_NAME="gemini-angular-${{ secrets.ALUMNO_ID }}-${{ secrets.ENVIRONMENT_NAME }}"

          CANARY_REV=$(gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format="value(status.latestCreatedRevisionName)")

          STABLE_REV=$(gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format="value(status.traffic.revisionName)" \
            | tr ';' '\n' | grep -v "$CANARY_REV" | head -n 1)

          echo "Revirtiendo el 100% a la versión estable: $STABLE_REV"

          gcloud run services update-traffic "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --to-revisions="$STABLE_REV=100"
